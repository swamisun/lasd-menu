name: Update menu

on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC (8am PDT / 7am PST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lasd_menu.py", ".github/workflows/update.yml"]

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Fetch, parse, and render
        run: uv run lasd_menu.py --verbose

      - name: Commit if anything changed
        run: |
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update menu $(date -u +%Y-%m-%d)"
          git push

      - name: Open or update an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create update-failed --color d73a4a --description "Weekly menu update failed" --force
          existing=$(gh issue list --label update-failed --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Menu update failed" --label update-failed \
              --body "The menu update workflow failed. Usually the district changed the PDF layout or the menus page. Run log: $RUN_URL"
          fi
